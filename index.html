<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12141a">
<meta name="description" content="한 박 단위로 채워넣는 모바일 드럼 사보 앱">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DrumCopy">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>DrumCopy — 드럼 사보</title>
</head>
<body>

<header>
  <div class="hrow">
    <input id="title" placeholder="곡 제목">
    <div class="bpm">
      <button data-bpm="-5">−</button><input id="bpm" type="number" value="100"><button data-bpm="5">+</button>
    </div>
    <button id="fab" class="btn ic" aria-label="팔레트 접기">∨</button>
    <button id="play" class="btn p">▶</button>
    <button id="menu" class="btn ic">☰</button>
  </div>
</header>

<div class="phead" id="phead"></div>
<main id="score"></main>
<div class="pfoot" id="pfoot"></div>

<footer>
  <div class="crumb" id="crumb"></div>
  <div class="instrow" id="instrow"></div>
  <div class="trow" id="trow"></div>
  <div class="tabs" id="tabs"></div>
  <div class="pals"><div class="pgrid" id="pgrid"></div></div>
</footer>

<div class="sheet" id="sheet"><div class="sbox" id="sbox"></div></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
